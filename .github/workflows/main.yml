name: Build PBRP - Redmi Note 15 4G (spinel)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEVICE: spinel
  PBRP_BRANCH: android-12.1
  USE_CCACHE: 0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            lzop \
            openjdk-11-jdk \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xz-utils \
            zip \
            zlib1g-dev

      - name: Install repo tool
        run: |
          set -e

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          "$HOME/bin/repo" --version

      - name: Initialize PBRP source
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/pbrp"

          cd "$GITHUB_WORKSPACE/pbrp"

          "$HOME/bin/repo" init \
            --depth=1 \
            -u https://github.com/PitchBlackRecoveryProject/manifest_pb \
            -b "$PBRP_BRANCH"

      - name: Sync PBRP source
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/pbrp"

          "$HOME/bin/repo" sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc --all)"

      - name: Install spinel device tree
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/pbrp/device/xiaomi"

          rm -rf \
            "$GITHUB_WORKSPACE/pbrp/device/xiaomi/spinel"

          cp -a \
            "$GITHUB_WORKSPACE/device_tree/device/xiaomi/spinel" \
            "$GITHUB_WORKSPACE/pbrp/device/xiaomi/spinel"

      - name: Check device tree
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/pbrp"

          echo "===== DEVICE TREE ====="

          find device/xiaomi/spinel \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "===== BOARD CONFIG ====="

          sed -n '1,240p' \
            device/xiaomi/spinel/BoardConfig.mk

      - name: Lunch PBRP spinel
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/pbrp"

          source build/envsetup.sh

          lunch "pb_${DEVICE}-eng"

      - name: Build recovery target
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/pbrp"

          source build/envsetup.sh

          lunch "pb_${DEVICE}-eng"

          echo "===== BUILD ENVIRONMENT ====="

          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "OUT=$OUT"

          echo
          echo "===== BUILD RECOVERY ====="

          m recovery -j"$(nproc --all)"

          echo
          echo "===== BUILD VENDOR BOOT ====="

          m vendorbootimage -j"$(nproc --all)"

          echo
          echo "===== CHECK RECOVERY EXECUTABLE ====="

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"

          find "$PRODUCT" \
            -type f \
            \( \
              -path "*/system/bin/recovery" \
              -o -path "*/system/bin/twrp" \
              -o -path "*/system/bin/pbrp" \
            \) \
            -ls || true

          echo
          echo "===== CHECK RECOVERY ROOT ====="

          if [ -d "$PRODUCT/recovery/root" ]; then
            find "$PRODUCT/recovery/root" \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -300
          else
            echo "WARNING: recovery/root does not exist"
          fi

      - name: Check build output
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/pbrp"

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"

          echo "===== SEARCHING FOR RECOVERY IMAGES ====="

          find "$PRODUCT" \
            -maxdepth 3 \
            -type f \
            \( \
              -name "recovery.img" \
              -o -name "pbrp.img" \
              -o -name "boot.img" \
              -o -name "vendor_boot.img" \
            \) \
            -print 2>/dev/null || true

          echo
          echo "===== PRODUCT OUTPUT ====="

          ls -lah "$PRODUCT" 2>/dev/null || true

      - name: Verify PBRP recovery ramdisk
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"

          echo "===== SEARCHING RECOVERY FILES ====="

          find "$PRODUCT" \
            -type f \
            \( \
              -path "*/recovery/*" \
              -o -name "recovery" \
              -o -name "pbrp" \
              -o -name "init.recovery.mt6789.rc" \
              -o -name "recovery.fstab" \
            \) \
            -print 2>/dev/null \
            | sort || true

          echo
          echo "===== RECOVERY BINARY CANDIDATES ====="

          find "$PRODUCT" \
            -type f \
            \( \
              -name "recovery" \
              -o -name "pbrp" \
            \) \
            -print 2>/dev/null \
            | sort || true

          echo
          echo "===== RECOVERY ROOT DIRECTORIES ====="

          find "$PRODUCT" \
            -type d \
            \( \
              -name "recovery" \
              -o -name "root" \
            \) \
            -print 2>/dev/null \
            | sort || true

      - name: Check recovery build configuration
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/pbrp"

          echo "===== RECOVERY CONFIG REFERENCES ====="

          grep -RniE \
            "TW_EXCLUDE|TW_INCLUDE|TARGET_RECOVERY|RECOVERY_BINARY|recovery.*binary|LOCAL_MODULE.*recovery|LOCAL_MODULE.*twrp|LOCAL_MODULE.*pbrp" \
            device vendor bootable system 2>/dev/null \
            | head -300 || true

          echo
          echo "===== RECOVERY BUILD TARGETS ====="

          find bootable system vendor \
            -type f \
            \( \
              -name "Android.bp" \
              -o -name "Android.mk" \
              -o -name "*.mk" \
            \) \
            -print 2>/dev/null \
            | grep -Ei "recovery|twrp|pitchblack|pbrp" \
            | head -200 || true

      - name: Find PBRP recovery binaries
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/pbrp"

          echo "===== ALL RECOVERY BINARIES ====="

          find out \
            -type f \
            \( \
              -name "recovery" \
              -o -name "twrp" \
              -o -name "pbrp" \
              -o -name "recovery_ramdisk*" \
            \) \
            -print 2>/dev/null \
            | sort || true

          echo
          echo "===== POSSIBLE RECOVERY EXECUTABLES ====="

          find out \
            -type f \
            -path "*/bin/*" \
            -print 2>/dev/null \
            | grep -E '/(recovery|twrp|pbrp)$' \
            || true

          echo
          echo "===== RECOVERY ROOT SIZE ====="

          du -ah \
            out/target/product/spinel/recovery/root \
            2>/dev/null \
            | tail -30 \
            || true

      - name: Verify PBRP recovery runtime
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel/recovery/root"
          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"

          echo "===== REQUIRED RECOVERY FILES ====="

          for file in \
            "$ROOT/system/bin/recovery" \
            "$ROOT/system/bin/twrp" \
            "$ROOT/system/bin/init" \
            "$ROOT/system/bin/toybox" \
            "$ROOT/etc/recovery.fstab" \
            "$ROOT/init.recovery.mt6789.rc"
          do
            if [ -f "$file" ]; then
              ls -lh "$file"
            else
              echo "ERROR: missing $file"
              exit 1
            fi
          done

          echo
          echo "===== SEARCH FOR SHELL ====="

          find "$ROOT" \
            -type f \
            \( \
              -name "sh" \
              -o -name "ash" \
              -o -name "bash" \
            \) \
            -ls 2>/dev/null || true

          echo
          echo "===== SEARCH FOR ADBD ====="

          find "$PRODUCT" \
            -type f \
            -name "adbd" \
            -ls 2>/dev/null || true

          echo
          echo "===== RECOVERY EXECUTABLE PERMISSIONS ====="

          ls -l \
            "$ROOT/system/bin/recovery" \
            "$ROOT/system/bin/twrp" \
            "$ROOT/system/bin/init" \
            "$ROOT/system/bin/toybox"

          echo
          echo "===== RECOVERY ROOT SIZE ====="

          du -sh "$ROOT"

          echo
          echo "===== RECOVERY ROOT FILE COUNT ====="

          find "$ROOT" \
            -type f \
            | wc -l

          echo
          echo "===== RECOVERY BINARIES ====="

          find "$ROOT/system/bin" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            2>/dev/null \
            | sort \
            | head -200

          echo
          echo "===== RECOVERY RUNTIME CHECK: OK ====="

      - name: Inspect PBRP vendor_boot
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"
          SCRIPT="$GITHUB_WORKSPACE/pbrp/device/xiaomi/spinel/tools/inspect_vendor_boot.py"

          test -f "$PRODUCT/vendor_boot.img"
          test -f "$SCRIPT"

          cd "$PRODUCT"

          echo "===== PBRP GENERATED VENDOR_BOOT ====="

          python3 "$SCRIPT" "vendor_boot.img"

          echo
          echo "===== GENERATED RECOVERY FRAGMENT ====="

          if [ -f "$PRODUCT/pbrp_recovery_fragment.bin" ]; then
            ls -lh "$PRODUCT/pbrp_recovery_fragment.bin"
            file "$PRODUCT/pbrp_recovery_fragment.bin" || true
          else
            echo "ERROR: pbrp_recovery_fragment.bin was not created"
            exit 1
          fi

      - name: Build stock-based vendor_boot
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"

          STOCK_VENDOR_BOOT="$GITHUB_WORKSPACE/device_tree/device/xiaomi/spinel/prebuilt/vendor_boot.img"
          PBRP_RECOVERY="$PRODUCT/pbrp_recovery_fragment.bin"
          SCRIPT="$GITHUB_WORKSPACE/pbrp/device/xiaomi/spinel/tools/replace_vendor_boot.py"
          OUTPUT="$PRODUCT/vendor_boot.img"

          echo "===== INPUT FILES ====="

          test -s "$STOCK_VENDOR_BOOT"
          test -s "$PBRP_RECOVERY"
          test -f "$SCRIPT"

          ls -lh "$STOCK_VENDOR_BOOT"
          ls -lh "$PBRP_RECOVERY"

          echo
          echo "===== REPLACE RECOVERY IN STOCK VENDOR_BOOT ====="

          python3 "$SCRIPT" \
            "$STOCK_VENDOR_BOOT" \
            "$PBRP_RECOVERY" \
            "$OUTPUT"

          echo
          echo "===== FINAL VENDOR_BOOT ====="

          test -s "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Verify stock-based vendor_boot
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"
          SCRIPT="$GITHUB_WORKSPACE/pbrp/device/xiaomi/spinel/tools/inspect_vendor_boot.py"

          test -s "$PRODUCT/vendor_boot.img"
          test -f "$SCRIPT"

          cd "$PRODUCT"

          echo "===== FINAL STOCK-BASED VENDOR_BOOT ====="

          python3 "$SCRIPT" "vendor_boot.img"

          echo
          echo "===== FINAL SIZE ====="

          stat -c '%s bytes' vendor_boot.img

          test "$(stat -c '%s' vendor_boot.img)" -eq 67108864

          echo
          echo "===== FINAL VENDOR_BOOT CHECK: OK ====="

      - name: Verify PBRP recovery fragment contents
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"
          FRAGMENT="$PRODUCT/pbrp_recovery_fragment.bin"

          test -s "$FRAGMENT"

          echo "===== PBRP RECOVERY FRAGMENT ====="

          ls -lh "$FRAGMENT"

          echo
          echo "===== FILE TYPE ====="

          file "$FRAGMENT"

          echo
          echo "===== LZ4 HEADER ====="

          xxd -l 16 "$FRAGMENT"

          echo
          echo "===== DECOMPRESS RECOVERY ====="

          mkdir -p "$PRODUCT/recovery_fragment_check"

          lz4 \
            -d \
            "$FRAGMENT" \
            "$PRODUCT/recovery_fragment_check/recovery.cpio"

          test -s \
            "$PRODUCT/recovery_fragment_check/recovery.cpio"

          echo
          echo "===== CPIO TYPE ====="

          file \
            "$PRODUCT/recovery_fragment_check/recovery.cpio"

          echo
          echo "===== EXTRACT RECOVERY ====="

          mkdir -p \
            "$PRODUCT/recovery_fragment_check/root"

          cd "$PRODUCT/recovery_fragment_check/root"

          cpio \
            -idm \
            --no-absolute-filenames \
            < "$PRODUCT/recovery_fragment_check/recovery.cpio"

          echo
          echo "===== REQUIRED RECOVERY FILES ====="

          for file in \
            "system/bin/recovery" \
            "system/bin/twrp" \
            "system/bin/init" \
            "system/bin/toybox" \
            "system/bin/minadbd" \
            "system/bin/fastbootd" \
            "system/etc/recovery.fstab" \
            "init.recovery.mt6789.rc"
          do
            if [ -f "$file" ]; then
              ls -lh "$file"
            else
              echo "ERROR: missing $file"
              exit 1
            fi
          done

          echo
          echo "===== RECOVERY EXECUTABLES ====="

          file \
            system/bin/recovery \
            system/bin/twrp \
            system/bin/init \
            system/bin/toybox \
            system/bin/minadbd \
            system/bin/fastbootd

          echo
          echo "===== RECOVERY FILE COUNT ====="

          find . \
            -type f \
            | wc -l

          echo
          echo "===== RECOVERY SIZE ====="

          du -sh .

          echo
          echo "===== PBRP RECOVERY FRAGMENT CHECK: OK ====="

      - name: Verify PBRP Android 16 runtime compatibility
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"
          ROOT="$PRODUCT/recovery_fragment_check/root"

          test -d "$ROOT"

          echo "===== PBRP ANDROID RUNTIME COMPATIBILITY ====="

          echo
          echo "===== BUILD PROPERTIES ====="

          for prop in \
            "$ROOT/system/build.prop" \
            "$ROOT/prop.default"
          do
            if [ -f "$prop" ]; then
              echo
              echo "--- $prop ---"

              grep -E \
                '^(ro.build.version.sdk|ro.build.version.release|ro.build.version.codename|ro.product.first_api_level|ro.product.build.version.sdk)=' \
                "$prop" || true
            fi
          done

          echo
          echo "===== LINKER64 ====="

          if [ -f "$ROOT/system/bin/linker64" ]; then
            file "$ROOT/system/bin/linker64"
            ls -lh "$ROOT/system/bin/linker64"
          else
            echo "WARNING: system/bin/linker64 is not present"
          fi

          echo
          echo "===== LIBRARY DIRECTORIES ====="

          find "$ROOT/system" \
            -maxdepth 2 \
            -type d \
            \( \
              -name "lib" \
              -o -name "lib64" \
            \) \
            -print 2>/dev/null \
            | sort || true

          echo
          echo "===== CORE LIBRARIES ====="

          for file in \
            system/lib64/libc.so \
            system/lib64/libm.so \
            system/lib64/libdl.so \
            system/lib64/liblog.so \
            system/lib64/libbase.so \
            system/lib64/libselinux.so \
            system/lib64/libcrypto.so \
            system/lib64/libz.so \
            system/lib64/libutils.so \
            system/lib64/libcutils.so
          do
            if [ -f "$ROOT/$file" ]; then
              echo "OK   $file"
            else
              echo "MISS $file"
            fi
          done

          echo
          echo "===== REQUIRED RECOVERY LIBRARIES ====="

          find "$ROOT/system/lib64" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            2>/dev/null \
            | sort \
            | head -300 || true

          echo
          echo "===== ELF NEEDED LIBRARIES ====="

          for bin in \
            system/bin/recovery \
            system/bin/twrp \
            system/bin/init \
            system/bin/toybox \
            system/bin/minadbd \
            system/bin/fastbootd
          do
            echo
            echo "--- $bin ---"

            if [ -f "$ROOT/$bin" ]; then
              file "$ROOT/$bin"

              readelf -d "$ROOT/$bin" 2>/dev/null \
                | grep 'Shared library:' \
                || true
            else
              echo "MISSING: $bin"
            fi
          done

          echo
          echo "===== INTERPRETERS ====="

          for bin in \
            system/bin/recovery \
            system/bin/twrp \
            system/bin/init \
            system/bin/toybox \
            system/bin/minadbd \
            system/bin/fastbootd
          do
            if [ -f "$ROOT/$bin" ]; then
              echo
              echo "--- $bin ---"

              readelf -l "$ROOT/$bin" 2>/dev/null \
                | grep -E 'Requesting program interpreter|INTERP' \
                || true
            fi
          done

          echo
          echo "===== PBRP SOURCE PLATFORM VERSION ====="

          if [ -f "$GITHUB_WORKSPACE/pbrp/build/make/core/version_defaults.mk" ]; then
            grep -nE \
              'PLATFORM_VERSION|PLATFORM_SDK_VERSION|PLATFORM_VERSION_CODENAME' \
              "$GITHUB_WORKSPACE/pbrp/build/make/core/version_defaults.mk" \
              | head -50 \
              || true
          fi

          echo
          echo "===== PBRP BUILD VARIABLES ====="

          if [ -f "$PRODUCT/installed-files.txt" ]; then
            grep -E \
              'system/bin/(recovery|twrp|init|toybox|minadbd|fastbootd)' \
              "$PRODUCT/installed-files.txt" \
              | head -50 \
              || true
          fi

          echo
          echo "===== ANDROID RUNTIME CHECK COMPLETE ====="

      - name: Prepare artifacts
        run: |
          set -e

          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"
          PRODUCT="$GITHUB_WORKSPACE/pbrp/out/target/product/spinel"

          mkdir -p "$ARTIFACTS"

          echo "===== PBRP GENERATED VENDOR BOOT ====="

          test -f "$PRODUCT/vendor_boot.img"

          ls -lh "$PRODUCT/vendor_boot.img"

          cp \
            "$PRODUCT/vendor_boot.img" \
            "$ARTIFACTS/vendor_boot.img"

          echo
          echo "===== PBRP RECOVERY FRAGMENT ====="

          test -f "$PRODUCT/pbrp_recovery_fragment.bin"

          ls -lh "$PRODUCT/pbrp_recovery_fragment.bin"

          cp \
            "$PRODUCT/pbrp_recovery_fragment.bin" \
            "$ARTIFACTS/pbrp_recovery_fragment.bin"

          echo
          echo "===== PBRP RECOVERY OUTPUT ====="

          for file in \
            recovery.img \
            pbrp.img
          do
            if [ -f "$PRODUCT/$file" ]; then
              cp \
                "$PRODUCT/$file" \
                "$ARTIFACTS/$file"
            fi
          done

          echo
          echo "===== FINAL ARTIFACTS ====="

          ls -lah "$ARTIFACTS"

          test -s "$ARTIFACTS/vendor_boot.img"
          test -s "$ARTIFACTS/pbrp_recovery_fragment.bin"

      - name: Upload PBRP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-spinel
          path: artifacts/
          if-no-files-found: error
