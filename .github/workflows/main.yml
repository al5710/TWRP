name: Build PBRP - Redmi Note 15 4G (spinel)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEVICE: spinel
  PBRP_BRANCH: android-12.1
  USE_CCACHE: 1

jobs:
  build:
    name: Build PBRP vendor_boot
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2-utils lzop rsync unzip xsltproc zip zlib1g-dev

      - name: Prepare PBRP source
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/pbrp"
          cd "$GITHUB_WORKSPACE/pbrp"
          repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b "$PBRP_BRANCH"
          repo sync -c --no-clone-bundle --no-tags -j"$(nproc --all)"

      - name: Install spinel device tree
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/pbrp/device/xiaomi"
          rm -rf "$GITHUB_WORKSPACE/pbrp/device/xiaomi/$DEVICE"
          cp -a "$GITHUB_WORKSPACE/device_tree/device/xiaomi/$DEVICE" "$GITHUB_WORKSPACE/pbrp/device/xiaomi/$DEVICE"
          cd "$GITHUB_WORKSPACE/pbrp/device/xiaomi/$DEVICE/prebuilt"
          cat platform_ramdisk.part1 platform_ramdisk.part2 > platform_ramdisk.cpio.lz4
          rm -f platform_ramdisk.part1 platform_ramdisk.part2

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.ccache"
          ccache --max-size=10G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/pbrp"
          source build/envsetup.sh
          lunch pb_${DEVICE}-eng
          mka pbrp vendorbootimage -j"$(nproc --all)" || \
            mka pbrp -j"$(nproc --all)"

      - name: Check output
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/pbrp"
          find "out/target/product/$DEVICE" -maxdepth 1 -type f -print
          test -f "out/target/product/$DEVICE/vendor_boot.img"

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-spinel-OS3.0.301.0-WPGEUXM
          path: |
            pbrp/out/target/product/spinel/vendor_boot.img
            pbrp/out/target/product/spinel/recovery.img
            pbrp/out/target/product/spinel/boot.img
            pbrp/out/target/product/spinel/dtbo.img
          if-no-files-found: warn
